# Node-agent StatefulSet: exactly one pod per node on the tainted fc-mcp pool.
#
# Hard podAntiAffinity (one per node) gives the single-process-per-node invariant the
# code relies on; a local-PV volumeClaimTemplate pins each pod to its node's disk.
# Set `replicas` to the node count of the fc-mcp pool.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fc-node-agent
  namespace: fc-mcp
  labels:
    app: fc-node-agent
spec:
  serviceName: fc-node          # the headless Service
  replicas: 2                   # == number of nodes in the fc-mcp pool (adjust)
  podManagementPolicy: Parallel # nodes are independent; no ordering dependency
  updateStrategy:
    type: OnDelete              # upgrades are deliberate (each restart bounces a node's VMs)
  selector:
    matchLabels:
      app: fc-node-agent
  template:
    metadata:
      labels:
        app: fc-node-agent
    spec:
      serviceAccountName: fc-node-agent
      nodeSelector:
        fc-mcp: "true"
      tolerations:
        - key: fc-mcp
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:         # at most one node-agent per node
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: fc-node-agent
              topologyKey: kubernetes.io/hostname
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 120   # room for preStop drain (pause+snapshot)
      securityContext:
        runAsUser: 0
      initContainers:
        - name: network-setup
          image: fc-bash-mcp:latest
          imagePullPolicy: IfNotPresent   # use the kind-loaded image; :latest would otherwise default to Always
          command: ["bash", "setup-network.sh"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: fc-data
              mountPath: /opt/fc-mcp
      containers:
        - name: fc-node-agent
          image: fc-bash-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FC_BASE_DIR
              value: /opt/fc-mcp
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP            # hostNetwork: this is the node IP the router POSTs to
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: FC_MCP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FC_MAX_VMS
              value: "32"            # must match the tap count in setup-network.sh
            - name: FC_IDLE_PAUSE_SECONDS
              value: "300"           # snapshot+pause VMs idle >5min (frees RAM/CPU); next exec auto-resumes
            # Optional: archive paused-VM snapshots to S3 so they survive node loss (recover via
            # /restore). Unset = disabled. Creds via boto3 default chain (EC2 instance role through
            # IMDS here since hostNetwork; IRSA on EKS — see rbac.yaml). Needs s3:Get/Put/Delete/List.
            # - name: FC_S3_BUCKET
            #   value: "my-fc-mcp-snapshots"
            # - name: FC_S3_PREFIX
            #   value: "fc-mcp/snapshots"
            # - name: AWS_REGION
            #   value: "us-east-1"
          securityContext:
            privileged: true         # KVM + tap devices
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "curl -s -X POST http://localhost:8080/drain || true"]
          startupProbe:              # generous: first boot may build/copy images
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:            # 503 when full / not reconciled -> no new placement
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "500m", memory: "256Mi"}
            limits: {cpu: "2", memory: "1Gi"}  # VM memory comes from the host, not here
          volumeMounts:
            - name: fc-data
              mountPath: /opt/fc-mcp
            # Shared read-only kernel+rootfs and the matching SSH key, seeded onto
            # each node at /opt/fc-seed (the pod's PV is otherwise empty). In a real
            # cluster these would be baked into the image / pulled from object store.
            - name: vm-images
              mountPath: /opt/fc-mcp/vm-images
              readOnly: true
            - name: vm-ssh-key
              mountPath: /opt/fc-mcp/vm_ssh_key
              readOnly: true
            - name: kvm
              mountPath: /dev/kvm
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: vm-images
          hostPath: {path: /opt/fc-seed/vm-images, type: Directory}
        - name: vm-ssh-key
          hostPath: {path: /opt/fc-seed/vm_ssh_key, type: File}
        - name: kvm
          hostPath: {path: /dev/kvm, type: CharDevice}
        - name: dev-net-tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
  volumeClaimTemplates:
    - metadata:
        name: fc-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fc-local
        resources:
          requests:
            storage: 100Gi
