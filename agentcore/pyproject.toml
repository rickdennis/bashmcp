[project]
name = "bashmcp-agentcore"
version = "0.1.0"
description = "bash_exec for Claude Code on Amazon Bedrock AgentCore: MCP broker + per-user sandbox runtime"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "mcp>=1.27.0,<2",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.44",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "moto[dynamodb]>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

# Firm standard: resolve through Artifactory, never pypi.org directly.
# No exclude-newer here on purpose; the rolling 5-day floor lives in the session env.
[[tool.uv.index]]
name = "artifactory"
url = "https://artifactory.stoneridgeam.com/artifactory/api/pypi/pypi-am-shared-noenv-virtual/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
