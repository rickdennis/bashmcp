apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.fcmcp.io
spec:
  group: fcmcp.io
  scope: Namespaced
  names:
    kind: Session
    plural: sessions
    singular: session
    shortNames: [sess]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Binds one MCP session (Mcp-Session-Id, assigned by the router's MCP
            server) to the node that owns its VM. The cross-node routing source
            of truth. The pin (spec.nodeName) is immutable for the session's life.
          properties:
            spec:
              type: object
              required: [mcpSessionId, nodeName]
              properties:
                mcpSessionId:
                  type: string
                  description: The SDK-assigned Mcp-Session-Id (the routing key).
                nodeName:
                  type: string
                  description: The node this session is pinned to (immutable after bind).
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Bound, Lost, Terminating]
                vmRef:
                  type: string
                  description: vm_id of the backing Firecracker VM on the node.
                lastActivityTime:
                  type: string
                  format: date-time
                message:
                  type: string
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Node, type: string, jsonPath: .spec.nodeName}
        - {name: VM, type: string, jsonPath: .status.vmRef}
        - {name: Session, type: string, jsonPath: .spec.mcpSessionId, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
